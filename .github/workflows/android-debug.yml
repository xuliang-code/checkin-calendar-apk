name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK (default Maven repos)
        id: build_default
        continue-on-error: true
        run: cd android && ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Retry build with China Maven mirrors
        if: steps.build_default.outcome == 'failure'
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/cn-mirror.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/central' }
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                  }
              }
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          EOF
          sed -i 's#https\://services.gradle.org/distributions#https\://mirrors.cloud.tencent.com/gradle#' android/gradle/wrapper/gradle-wrapper.properties
          cd android && ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Debug APK Build ${{ github.run_number }}
          generate_release_notes: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
