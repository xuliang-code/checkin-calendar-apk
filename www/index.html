<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>每日打卡日历</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: transparent; padding: 15px; color: #333; }
    .container { max-width: 480px; margin: 0 auto; position: relative; }
    .stats { background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .stats h2 { font-size: 24px; color: #4a6cf7; margin-bottom: 4px; }
    .stats span { font-size: 12px; color: #888; }
    .calendar { background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h3 { font-size: 18px; }
    .header button { background: #4a6cf7; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    
    .weekdays { display: flex; justify-content: space-between; margin-bottom: 10px; text-align: center; color: #aaa; font-size: 13px; }
    .days { display: flex; flex-wrap: wrap; }
    .day { 
        width: 14.28%; height: 45px; display: flex; align-items: center; justify-content: center; 
        font-size: 15px; position: relative; cursor: pointer;
    }
    .day.empty { pointer-events: none; }
    .day.today { color: #4a6cf7; font-weight: bold; border: 1px solid #4a6cf7; border-radius: 6px; margin: 1px; width: calc(14.28% - 2px); height: 43px; }
    .day.checked { background: #4a6cf7; color: #fff; border-radius: 6px; margin: 1px; width: calc(14.28% - 2px); height: 43px; }
    .day.selected { border: 2px solid #ff9f43; box-shadow: 0 0 0 2px rgba(255,159,67,0.2); }
    .note-mark { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; box-shadow: 0 0 2px rgba(251, 191, 36, 0.6); }
    .panel { display: none; background: rgba(255,255,255,0.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 20px; border-radius: 12px; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .panel.active { display: block; }
    .panel h4 { margin-bottom: 15px; font-size: 16px; color: #333; }
    .btn-main { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; color: #fff; background: #4a6cf7; margin-bottom: 15px; cursor: pointer; }
    .btn-main.undo { background: #ff6b6b; }
    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 14px; margin-bottom: 10px; }
    .btn-sub { padding: 8px 16px; background: #eee; border: none; border-radius: 6px; color: #555; cursor: pointer; float: right; }
    .cat-top-btn { position: fixed; top: 18px; right: 18px; width: 40px; height: 40px; background: #4a6cf7; color: #fff; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; box-shadow: 0 3px 10px rgba(74,108,247,0.4); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: rgba(255,255,255,0.85); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 380px; max-height: 80vh; overflow-y: auto; animation: modalIn 0.25s ease; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-box h3 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .modal-box h3 .close-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: #f0f0f0; font-size: 16px; cursor: pointer; color: #666; }
    
    .modal-cat-list { margin-bottom: 16px; }
    .modal-cat-item { display: flex; align-items: center; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; background: #f8f9fa; gap: 10px; }
    .modal-cat-item .color-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
    .modal-cat-item .cat-name { flex: 1; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal-cat-item .cat-name:hover { color: #4a6cf7; }
    .rename-input { flex: 1; font-size: 14px; padding: 4px 8px; border: 1px solid #4a6cf7; border-radius: 4px; outline: none; }
    .modal-cat-item .del-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: #fee2e2; color: #ef4444; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-add-row { display: flex; gap: 8px; align-items: center; }
    .modal-add-row input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .modal-add-row input:focus { outline: none; border-color: #4a6cf7; }
    .modal-add-row .color-pick { width: 38px; height: 38px; border-radius: 8px; border: 2px solid #ddd; cursor: pointer; padding: 0; }
    .modal-add-row .add-btn { padding: 10px 16px; background: #4a6cf7; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-bar .filter-label { font-size: 13px; color: #666; font-weight: 600; }
    .filter-chip { padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; opacity: 0.6; transition: all 0.15s; border: 2px solid transparent; }
    .filter-chip.active { opacity: 1; transform: scale(1.05); box-shadow: 0 2px 6px rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.1); }
    .filter-chip.all { background: #333; }
    .summary-item { background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .summary-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .summary-head .color-dot { width: 12px; height: 12px; border-radius: 50%; }
    .summary-head .cat-name { font-weight: 600; font-size: 14px; flex: 1; }
    .summary-head .check-status { font-size: 12px; color: #999; }
    .summary-head .check-status.done { color: #10b981; font-weight: 600; }
    .summary-note { font-size: 13px; color: #555; background: #fff; padding: 8px; border-radius: 6px; border-left: 3px solid #fbbf24; margin-top: 4px; }

<body>
<div class="bg-layer-root" aria-hidden="true">
    <div class="bg-layer" data-bg="all"></div>
    <div class="bg-layer" data-bg="life"></div>
    <div class="bg-layer" data-bg="work"></div>
    <div class="bg-layer" data-bg="study"></div>
    <div class="bg-layer" data-bg="health"></div>
    <div class="bg-overlay"></div>
</div>
<button class="cat-top-btn" id="catManageBtn" title="管理打卡本">☰</button>
<div class="container">
    <div class="stats">
        <div><h2 id="st-total">0</h2><span>累计</span></div>
        <div><h2 id="st-streak">0</h2><span>连续</span></div>
        <div><h2 id="st-month">0</h2><span>本月</span></div>
    </div>
    <div class="filter-bar" id="filterBar">
        <span class="filter-label">打卡本：</span>
    </div>
    <div class="calendar">
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h3 id="monthTitle">2026年10月</h3>
            <button id="todayBtn">今天</button>
        </div>
        <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="days" id="daysGrid"></div>
    </div>
    <div class="panel" id="actionPanel">
        <h4 id="panelDate">10月1日</h4>
        <button class="btn-main" id="btnCheck">打卡</button>
        <textarea id="noteInput" placeholder="输入备注，点别处/输入法完成自动保存..."></textarea>
        <button class="btn-sub" id="btnNote">保存备注</button>
        <div style="clear:both;"></div>
    </div>
</div>
<div class="modal-overlay" id="catModal">
    <div class="modal-box">
        <h3>📂 管理打卡本 <button class="close-btn" id="catModalClose">✕</button></h3>
        <div class="modal-cat-list" id="catList"></div>
        <div class="modal-add-row">
            <input type="text" id="newCatName" placeholder="新本子名称" maxlength="6">
            <input type="color" class="color-pick" id="newCatColor" value="#4a6cf7">
            <button class="add-btn" id="addCatBtn">添加</button>
        </div>
    </div>
</div>
<div class="modal-overlay" id="summaryModal">
    <div class="modal-box">
        <h3><span id="summaryTitle">记录总览</span><button class="close-btn" id="summaryClose">✕</button></h3>
        <div id="summaryList"></div>
    </div>
</div>
<script>
(function() {
    'use strict';
    // ========== 配置区 ==========
    const DEFAULT_START_ID = 'work'; // 打开页面默认显示的分类，改这里切换默认打卡本
    const KEY = 'daily_checkin_v5';
    const OLD_KEY = 'daily_checkin_final';
    const CAT_KEY = 'daily_checkin_cats';
    var DEFAULT_CATS = [
        { id: 'life', name: '生活', color: '#10b981' },
        { id: 'work', name: '工作', color: '#4a6cf7' },
        { id: 'study', name: '学习', color: '#f59e0b' },
        { id: 'health', name: '健身', color: '#ef4444' }
    ];

    // 安全读取 localStorage
    function safeGet(key, fallback) {
        try {
            var raw = localStorage.getItem(key);
            if (!raw) return fallback;
            var parsed = JSON.parse(raw);
            return parsed || fallback;
        } catch (e) {
            return fallback;
        }
    }
    var categories = safeGet(CAT_KEY, null);
    if (!categories || !Array.isArray(categories) || categories.length === 0) {
        categories = DEFAULT_CATS.slice();
    }
    function saveCats() {
        try { localStorage.setItem(CAT_KEY, JSON.stringify(categories)); } catch(e) {}
    }

    // 初始化数据结构
    var data = {};
    function initData() {
        for (var i = 0; i < categories.length; i++) {
            data[categories[i].id] = { checks: {}, notes: {} };
        }
    }

    // 迁移旧数据
    function migrate() {
        try {
            var oldRaw = localStorage.getItem(OLD_KEY);
            if (!oldRaw) return;
            var oldData = JSON.parse(oldRaw);
            if (!oldData) return;
            var oldChecks = (oldData && oldData.checks) || {};
            var oldNotes = (oldData && oldData.notes) || {};
            var oldCats = (oldData && oldData.cats) || {};
            for (var dateKey in oldChecks) {
                var catId = oldCats[dateKey] || 'life';
                var found = false;
                for (var i = 0; i < categories.length; i++) {
                    if (categories[i].id === catId) { found = true; break; }
                }
                if (!found) catId = 'life';
                if (!data[catId]) data[catId] = { checks: {}, notes: {} };
                data[catId].checks[dateKey] = true;
            }
            for (var dateKey2 in oldNotes) {
                var catId2 = oldCats[dateKey2] || 'life';
                var found2 = false;
                for (var j = 0; j < categories.length; j++) {
                    if (categories[j].id === catId2) { found2 = true; break; }
                }
                if (!found2) catId2 = 'life';
                if (!data[catId2]) data[catId2] = { checks: {}, notes: {} };
                data[catId2].notes[dateKey2] = oldNotes[dateKey2];
            }
            localStorage.removeItem(OLD_KEY);
        } catch (e) {}
    }

    // 加载数据
    var loaded = safeGet(KEY, null);
    if (loaded && typeof loaded === 'object') {
        for (var i = 0; i < categories.length; i++) {
            var cid = categories[i].id;
            if (loaded[cid] && typeof loaded[cid] === 'object') {
                data[cid] = {
                    checks: loaded[cid].checks || {},
                    notes: loaded[cid].notes || {}
                };
            } else {
                data[cid] = { checks: {}, notes: {} };
            }
        }
    } else {
        initData();
        migrate();
    }
    function saveData() {
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {}
    }

    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth();
    var selectedKey = null;
    // 默认启动分类
    var currentFilter = DEFAULT_START_ID;
    // 校验默认分类是否存在，不存在则回退
    (function(){
        var exist = false;
        for(var i=0;i<categories.length;i++){
            if(categories[i].id === DEFAULT_START_ID){ exist = true; break; }
        }
        if(!exist) currentFilter = categories.length>0 ? categories[0].id : 'all';
    })();

    function getCatName(id) {
        if (id === 'all') return '全部';
        for (var i = 0; i < categories.length; i++) {
            if (categories[i].id === id) return categories[i].name;
        }
        return '未知';
    }
    function getCatColor(id) {
        for (var i = 0; i < categories.length; i++) {
            if (categories[i].id === id) return categories[i].color;
        }
        return '#999';
    }

    function render() {
        document.getElementById('monthTitle').innerText = y + '年' + (m + 1) + '月';
        var grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        
        var firstDay = new Date(y, m, 1).getDay();
        var daysInMonth = new Date(y, m + 1, 0).getDate();
        
        for (var i = 0; i < firstDay; i++) {
            var emptyDiv = document.createElement('div');
            emptyDiv.className = 'day empty';
            grid.appendChild(emptyDiv);
        }
        
        for (var d = 1; d <= daysInMonth; d++) {
            var el = document.createElement('div');
            var key = y + '-' + (m + 1) + '-' + d;
            el.className = 'day';
            el.innerText = d;
            var isChecked = false;
            var hasNote = false;
            
            if (currentFilter === 'all') {
                for (var i = 0; i < categories.length; i++) {
                    var cid = categories[i].id;
                    if (data[cid]) {
                        if (data[cid].checks[key]) isChecked = true;
                        if (data[cid].notes[key]) hasNote = true;
                    }
                }
            } else {
                var catData = data[currentFilter];
                if (catData) {
                    isChecked = !!catData.checks[key];
                    hasNote = !!catData.notes[key];
                }
            }
            if (d === now.getDate() && m === now.getMonth() && y === now.getFullYear()) {
                el.classList.add('today');
                el.id = 'todayCell'; 
            }
            
            if (isChecked) el.classList.add('checked');
            if (selectedKey === key) el.classList.add('selected');
            
            if (hasNote) {
                var mark = document.createElement('div');
                mark.className = 'note-mark';
                el.appendChild(mark);
            }
            
            (function(dateKey, dateNum, element) {
                element.onclick = function() { handleDayClick(dateKey, dateNum, element); };
            })(key, d, el);
            
            grid.appendChild(el);
        }
        
        renderStats();
        renderFilterBar();
    }

    function renderFilterBar() {
        var bar = document.getElementById('filterBar');
        bar.innerHTML = '<span class="filter-label">打卡本：</span>';
        
        var allChip = document.createElement('span');
        allChip.className = 'filter-chip all' + (currentFilter === 'all' ? ' active' : '');
        allChip.textContent = '全部';
        allChip.onclick = function() { 
            currentFilter = 'all'; 
            selectedKey = null; 
            document.getElementById('actionPanel').classList.remove('active'); 
            render(); 
        };
        bar.appendChild(allChip);
        for (var i = 0; i < categories.length; i++) {
            (function(cat) {
                var chip = document.createElement('span');
                chip.className = 'filter-chip' + (currentFilter === cat.id ? ' active' : '');
                chip.style.background = cat.color;
                chip.textContent = cat.name;
                chip.onclick = function() { 
                    currentFilter = cat.id; 
                    selectedKey = null; 
                    document.getElementById('actionPanel').classList.remove('active'); 
                    render(); 
                };
                bar.appendChild(chip);
            })(categories[i]);
        }
    }

    function handleDayClick(key, day, el) {
        selectedKey = key;
        var days = document.querySelectorAll('.day');
        for (var i = 0; i < days.length; i++) days[i].classList.remove('selected');
        el.classList.add('selected');
        if (currentFilter === 'all') {
            showSummaryModal(key, day);
        } else {
            openCheckPanel(key, day);
        }
    }

    function openCheckPanel(key, day) {
        var catData = data[currentFilter];
        if (!catData) return;
        
        document.getElementById('actionPanel').classList.add('active');
        document.getElementById('panelDate').innerText = (m + 1) + '月' + day + '日 · ' + getCatName(currentFilter);
        document.getElementById('noteInput').value = catData.notes[key] || '';
        
        var btn = document.getElementById('btnCheck');
        if (catData.checks[key]) {
            btn.innerText = '取消打卡';
            btn.className = 'btn-main undo';
        } else {
            btn.innerText = '立即打卡';
            btn.className = 'btn-main';
        }
        
        setTimeout(function() {
            var panel = document.getElementById('actionPanel');
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 150);
    }

    function showSummaryModal(key, day) {
        document.getElementById('summaryTitle').innerText = (m + 1) + '月' + day + '日 记录总览';
        var list = document.getElementById('summaryList');
        list.innerHTML = '';
        
        for (var i = 0; i < categories.length; i++) {
            (function(cat) {
                var catData = data[cat.id] || { checks: {}, notes: {} };
                var isCheck = !!catData.checks[key];
                var note = catData.notes[key] || '';
                
                var item = document.createElement('div');
                item.className = 'summary-item';
                
                var head = document.createElement('div');
                head.className = 'summary-head';
                
                var dot = document.createElement('span');
                dot.className = 'color-dot';
                dot.style.background = cat.color;
                head.appendChild(dot);
                
                var name = document.createElement('span');
                name.className = 'cat-name';
                name.textContent = cat.name;
                head.appendChild(name);
                
                var status = document.createElement('span');
                status.className = 'check-status' + (isCheck ? ' done' : '');
                status.textContent = isCheck ? '✅ 已打卡' : '❌ 未打卡';
                head.appendChild(status);
                
                item.appendChild(head);
                
                if (note) {
                    var noteDiv = document.createElement('div');
                    noteDiv.className = 'summary-note';
                    noteDiv.textContent = '📝 ' + note;
                    item.appendChild(noteDiv);
                }
                
                list.appendChild(item);
            })(categories[i]);
        }
        
        document.getElementById('summaryModal').classList.add('active');
    }

    function scrollToToday() {
        setTimeout(function() {
            var todayCell = document.getElementById('todayCell');
            if (todayCell) {
                todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
                todayCell.style.transition = 'box-shadow 0.3s';
                todayCell.style.boxShadow = '0 0 0 3px rgba(74,108,247,0.4)';
                setTimeout(function() { todayCell.style.boxShadow = 'none'; }, 1000);
            }
        }, 100);
    }

    // 打卡按钮
    document.getElementById('btnCheck').onclick = function() {
        if (!selectedKey || currentFilter === 'all') return;
        var catData = data[currentFilter];
        if (!catData) return;
        
        var isChecking = !catData.checks[selectedKey]; 
        if (isChecking) {
            catData.checks[selectedKey] = true;
        } else {
            delete catData.checks[selectedKey];
        }
        saveData();
        render();
        openCheckPanel(selectedKey, parseInt(selectedKey.split('-')[2]));
    };

    // ========== 备注自动保存 ==========
    var autoSaveTimer = null;
    var noteInput = document.getElementById('noteInput');

    // 输入停止400ms自动保存
    noteInput.addEventListener('input', function() {
        if (!selectedKey || currentFilter === 'all') return;
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(saveNote, 400);
    });
    // 失去焦点（点别处、输入法点完成）立刻保存
    noteInput.addEventListener('blur', function() {
        if (!selectedKey || currentFilter === 'all') return;
        clearTimeout(autoSaveTimer);
        saveNote();
    });

    function saveNote() {
        var catData = data[currentFilter];
        if (!catData) return;
        var val = noteInput.value.trim();
        if (val) {
            catData.notes[selectedKey] = val;
        } else {
            delete catData.notes[selectedKey];
        }
        saveData();
        render();
    }

    // 保留原保存按钮
    document.getElementById('btnNote').onclick = function() {
        if (!selectedKey || currentFilter === 'all') return;
        saveNote();
        alert('备注已保存');
    };

    function renderStats() {
        var total = 0, monthCount = 0, streak = 0;
        var pre = y + '-' + (m + 1) + '-';
        
        if (currentFilter === 'all') {
            var allDates = {};
            for (var i = 0; i < categories.length; i++) {
                var cid = categories[i].id;
                if (data[cid] && data[cid].checks) {
                    var keys = Object.keys(data[cid].checks);
                    for (var j = 0; j < keys.length; j++) {
                        allDates[keys[j]] = true;
                    }
                }
            }
            var allKeys = Object.keys(allDates);
            total = allKeys.length;
            for (var j = 0; j < allKeys.length; j++) {
                if (allKeys[j].indexOf(pre) === 0) monthCount++;
            }
            
            var d = new Date();
            while (true) {
                var dKey = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
                if (allDates[dKey]) { streak++; d.setDate(d.getDate() - 1); } else break;
            }
        } else {
            var catData = data[currentFilter];
            if (!catData) return;
            var keys = Object.keys(catData.checks || {});
            total = keys.length;
            for (var i = 0; i < keys.length; i++) {
                if (keys[i].indexOf(pre) === 0) monthCount++;
            }
            
            var d = new Date();
            while (true) {
                var dKey = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
                if (catData.checks[dKey]) { streak++; d.setDate(d.getDate() - 1); } else break;
            }
        }
        
        document.getElementById('st-total').innerText = total;
        document.getElementById('st-month').innerText = monthCount;
        document.getElementById('st-streak').innerText = streak;
    }

    document.getElementById('prevBtn').onclick = function() { 
        m--; if(m < 0){m = 11; y--;} 
        selectedKey = null; 
        document.getElementById('actionPanel').classList.remove('active'); 
        render(); 
    };
    
    document.getElementById('todayBtn').onclick = function() { 
        y = now.getFullYear(); 
        m = now.getMonth(); 
        selectedKey = null; 
        document.getElementById('actionPanel').classList.remove('active'); 
        render(); 
        scrollToToday();
        setTimeout(function() {
            var todayCell = document.getElementById('todayCell');
            if (todayCell) handleDayClick(y + '-' + (m+1) + '-' + now.getDate(), now.getDate(), todayCell);
        }, 200);
    };

    // 分类管理弹窗
    document.getElementById('catManageBtn').onclick = function() { 
        renderCatModal(); 
        document.getElementById('catModal').classList.add('active'); 
    };
    document.getElementById('catModalClose').onclick = function() { 
        document.getElementById('catModal').classList.remove('active'); 
    };
    document.getElementById('catModal').onclick = function(e) { 
        if (e.target === document.getElementById('catModal')) 
            document.getElementById('catModal').classList.remove('active'); 
    };
    document.getElementById('summaryClose').onclick = function() { 
        document.getElementById('summaryModal').classList.remove('active'); 
    };
    document.getElementById('summaryModal').onclick = function(e) { 
        if (e.target === document.getElementById('summaryModal')) 
            document.getElementById('summaryModal').classList.remove('active'); 
    };

    // ========== 分类列表渲染（加重命名） ==========
    function renderCatModal() {
        var list = document.getElementById('catList');
        list.innerHTML = '';
        for (var i = 0; i < categories.length; i++) {
            (function(cat, idx) {
                var item = document.createElement('div');
                item.className = 'modal-cat-item';
                
                var dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = cat.color;
                item.appendChild(dot);
                
                var name = document.createElement('span');
                name.className = 'cat-name';
                name.textContent = cat.name;
                // 点击名称触发重命名
                name.onclick = function(){
                    var input = document.createElement('input');
                    input.className = 'rename-input';
                    input.value = cat.name;
                    item.replaceChild(input, name);
                    input.focus();
                    input.select();

                    function finishRename(){
                        var newName = input.value.trim();
                        if(newName){
                            cat.name = newName;
                            saveCats();
                        }
                        renderCatModal();
                        renderFilterBar();
                    }
                    input.onblur = finishRename;
                    input.onkeydown = function(e){
                        if(e.key === 'Enter') finishRename();
                    };
                };
                item.appendChild(name);
                
                var delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.textContent = '✕';
                delBtn.onclick = function() {
                    if (categories.length <= 1) { alert('至少保留一个打卡本'); return; }
                    if (confirm('确定删除"' + cat.name + '"本吗？该本所有记录将被清除！')) {
                        categories.splice(idx, 1);
                        delete data[cat.id];
                        if (currentFilter === cat.id) currentFilter = 'all';
                        saveCats(); saveData(); renderCatModal(); render();
                    }
                };
                item.appendChild(delBtn);
                
                list.appendChild(item);
            })(categories[i], i);
        }
    }

    document.getElementById('addCatBtn').onclick = function() {
        var name = document.getElementById('newCatName').value.trim();
        var color = document.getElementById('newCatColor').value;
        if (!name) { alert('请输入名称'); return; }
        if (categories.length >= 8) { alert('最多支持8个本子'); return; }
        var id = 'cat_' + Date.now();
        categories.push({ id: id, name: name, color: color });
        data[id] = { checks: {}, notes: {} };
        saveCats(); saveData();
        document.getElementById('newCatName').value = '';
        renderCatModal(); render();
    };

    // 启动渲染
    render();
})();
</script>
<script>
/* ===== 场景背景联动模块（新增，独立于业务逻辑，通过观察打卡本切换联动背景） ===== */
(function () {
    'use strict';
    var CAT_KEY = 'daily_checkin_cats';
    var FALLBACK_CATS = [ { id: 'life' }, { id: 'work' }, { id: 'study' }, { id: 'health' } ];
    function readCats() {
        try {
            var raw = localStorage.getItem(CAT_KEY);
            var arr = raw ? JSON.parse(raw) : null;
            return (arr && arr.length) ? arr : FALLBACK_CATS;
        } catch (e) { return FALLBACK_CATS; }
    }
    function activeCatId() {
        var chips = document.querySelectorAll('#filterBar .filter-chip');
        for (var i = 0; i < chips.length; i++) {
            if (chips[i].classList.contains('active')) {
                if (i === 0) return 'all';
                var cats = readCats();
                var cat = cats[i - 1];
                return (cat && cat.id) ? cat.id : 'all';
            }
        }
        return 'all';
    }
    function themeOf(id) {
        return (id === 'work' || id === 'study' || id === 'health' || id === 'life') ? id : 'all';
    }
    var current = '';
    function apply() {
        var t = themeOf(activeCatId());
        if (t === current) return;
        current = t;
        var layers = document.querySelectorAll('.bg-layer');
        for (var i = 0; i < layers.length; i++) {
            if (layers[i].getAttribute('data-bg') === t) layers[i].classList.add('active');
            else layers[i].classList.remove('active');
        }
    }
    var bar = document.getElementById('filterBar');
    if (bar && window.MutationObserver) {
        new MutationObserver(apply).observe(bar, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    }
    apply();
})();
</script>
</body>
